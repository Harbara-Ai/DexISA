[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexisa"
version = "0.2.0"
description = "DexISA offline MuJoCo physical-interaction runtime for four hand embodiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mujoco>=3.3,<4", "numpy>=1.26", "jsonschema>=4"]

[project.scripts]
dexisa-mujoco = "dex_hand.bridge.mujoco_adapter:main"

[tool.setuptools.packages.find]
include = ["dex_hand*"]

[tool.setuptools.package-data]
dex_hand = ["schema/*.md"]
"dex_hand.adapters" = ["profiles/*.json"]
